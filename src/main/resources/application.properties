spring.application.name=sb-ecom

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:test

spring.jpa.show-sql=true
spring.jpa.properties.hibernete.format_sql=true

# Disable open-in-view pattern (best practice - prevents lazy loading issues in views)
spring.jpa.open-in-view=false

#spring.jpa.hibernate.ddl-auto=update (will update the schema)       # create, create-drop(will drop old schema and create a new one), update, validate, none